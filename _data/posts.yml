# Blog posts, sorted newest first (by date) within each section.
# section: writing
# best_of: year the post won the Best of LessWrong review (shown as a gold tag linking to that year's page).
# best_of_category: optional category on that page (e.g. modeling), to filter the list down to it.
# curated: true if curated on LessWrong (shown as "Curated on LessWrong", or just "Curated" next to a Best of tag).
# image (in assets/img), image_alt, image_size (small or large) or image_height (in pixels), caption: optional illustration shown under the post.
# quote: optional {text, author, url}, shown as a small back-cover-style blurb under the description.
# venue: optional, for posts published outside the blog (shown next to the year).
# featured: optional list of {label, url, note, style} for other distinctions (blue tags by default; url and note optional;
#   note shows on hover; style: chocolate for a brown tag).

